<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Mimadoo Pet Spa</title>
    <style>
      /* Add a black background color to the top navigation */
      .topnav {
        background-color: #f4c280;
        overflow: hidden;
        text-align: center;
      }

      /* Style the links inside the navigation bar */
      .topnav a {
        float: left;
        color: #0c0e0edc;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }

      /* Change the color of links on hover */
      .topnav a:hover {
        background-color: #76e8b1;
        color: black;
      }

      /* Add a color to the active/current link */
      .topnav a.active {
        background-color: #f4c280;
        color: black;
      }

      .logo {
        display: block; /* Changes image from inline to block */
        margin: 100 auto; /* Centers horizontally by distributing space evenly */
        max-width: 1000px; /* Sets your desired logo size */
      }
    </style>
  </head>
  <body>
    <img
      src="./assets/Images/Mimadoo_Logo.jpg"
      height="400"
      alt="Mimadoo Logo"
      class="logo"
    />

    <div class="topnav">
      <a class="active" href="#home">Home</a>
      <a href="#news">News</a>
      <a href="#contact">Contact</a>
      <a href="#about">About</a>
    </div>
  </body>
</html>
